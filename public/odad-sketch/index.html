<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ODAD Sketch</title>
  <link rel="stylesheet" href="../../src/styles/tokens.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; font-family: var(--font-sans); }
    #p5-container { width: 100%; height: 100%; }
    #controls {
      position: absolute;
      top: var(--space-4);
      left: var(--space-4);
      z-index: 100;
      color: #fff;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .control-row {
      display: flex;
      gap: var(--space-3);
      align-items: center;
    }
    .control-row label {
      min-width: 50px;
      line-height: 12px;
      display: flex;
      align-items: center;
    }
    .slider {
      width: 140px;
      height: 12px;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
      border: none;
      padding: 0;
      margin: 0;
      display: block;
    }
    .slider::-webkit-slider-runnable-track {
      background: #fff;
      height: 1px;
      border: none;
      margin: 0;
      padding: 0;
    }
    .slider::-webkit-slider-track {
      background: #fff;
      height: 1px;
      border: none;
    }
    .slider::-moz-range-track {
      background: #fff;
      height: 1px;
      border: none;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      background: #fff;
      border: 1px solid #121212;
      border-radius: 50%;
      cursor: pointer;
      margin-top: -6px;
    }
    .slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: #fff;
      border: 1px solid #121212;
      border-radius: 50%;
      cursor: pointer;
      margin-top: 0;
    }
    .value-display {
      min-width: 32px;
      font-size: 12px;
      line-height: 12px;
      display: flex;
      align-items: center;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
  <div id="p5-container"></div>
  <div id="controls">
    <div class="control-row">
      <label for="speedSlider">Speed</label>
      <input type="range" id="speedSlider" class="slider" min="0.1" max="1.9" step="0.05" value="1" />
      <span id="speedValue" class="value-display">1x</span>
    </div>
    <div class="control-row">
      <label for="sizeSlider">Size</label>
      <input type="range" id="sizeSlider" class="slider" min="0.1" max="1.9" step="0.05" value="1" />
      <span id="sizeValue" class="value-display">1x</span>
    </div>
  </div>
  <script>
    // Configuration Constants
    const COLORS = {
      SDblue: '#0064FF',
      SDred: '#FF4132',
      SDyellow: '#ffe600'
    };

    // Names for each color (hard-coded)
    const NAME_BLUE = "superdot";
    const NAME_RED = "information";
    const NAME_YELLOW = "designsystem";

    // Create noise offsets for each character
    function createNoiseOffsets(text) {
      return {
        x: Array(text.length).fill().map((_, i) => i * 100 + Math.random() * 1000),
        y: Array(text.length).fill().map((_, i) => i * 1000 + Math.random() * 1000)
      };
    }

    const noiseOffsets = {
      blue: createNoiseOffsets(NAME_BLUE),
      red: createNoiseOffsets(NAME_RED),
      yellow: createNoiseOffsets(NAME_YELLOW)
    };

    // Map each letter to a size (a-z)
    const letterSizes = {};
    for (let i = 0; i < 26; i++) {
      letterSizes[String.fromCharCode(97 + i)] = 20 + (i % 5) * 30;
    }
    let speedMultiplier = 1.0;
    let sizeMultiplier = 1.0;
    const baseIncrement = 0.0025;

    function setup() {
      const canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent("p5-container");
      background(30);

      // Setup speed slider
      const speedSlider = document.getElementById('speedSlider');
      const speedValueDisplay = document.getElementById('speedValue');
      speedSlider.addEventListener('input', (e) => {
        speedMultiplier = parseFloat(e.target.value);
        speedValueDisplay.textContent = speedMultiplier.toFixed(1) + 'x';
      });

      // Setup size slider
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValueDisplay = document.getElementById('sizeValue');
      sizeSlider.addEventListener('input', (e) => {
        sizeMultiplier = parseFloat(e.target.value);
        sizeValueDisplay.textContent = sizeMultiplier.toFixed(1) + 'x';
      });
    }

    function draw() {
      background(30, 10);
      generateCircles(NAME_BLUE, COLORS.SDblue, noiseOffsets.blue);
      generateCircles(NAME_RED, COLORS.SDred, noiseOffsets.red);
      generateCircles(NAME_YELLOW, COLORS.SDyellow, noiseOffsets.yellow);
    }

    function generateCircles(name, color, noiseOffset) {
      blendMode(LIGHTEST);

      for (let i = 0; i < name.length; i++) {
        const letter = name[i].toLowerCase();
        if (!/[a-z]/.test(letter)) continue; // Skip non-letters

        noiseOffset.x[i] += baseIncrement * speedMultiplier;
        noiseOffset.y[i] += baseIncrement * speedMultiplier;

        const maxSize = 200;
        const x = map(noise(noiseOffset.x[i]), 0, 1, -maxSize, width + maxSize);
        const y = map(noise(noiseOffset.y[i]), 0, 1, -maxSize, height + maxSize);
        const baseSize = letterSizes[letter] || 40;
        const size = baseSize * sizeMultiplier;

        displayDot(x, y, size, color);
      }

      blendMode(BLEND);
    }

    function displayDot(x, y, size, color) {
      noStroke();
      fill(color);
      circle(x, y, size);
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
