<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ODAD Sketch</title>
  <style>
    /* CSS Variables inline */
    :root {
      --font-sans: "TikTok Sans", Helvetica, Arial, sans-serif;
      --space-3: 0.75rem;
      --space-4: 1rem;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; font-family: var(--font-sans); }
    #p5-container { width: 100%; height: 100%; }
    #controls {
      position: absolute;
      top: var(--space-4);
      left: var(--space-4);
      z-index: 100;
      color: #fff;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .control-row {
      display: flex;
      gap: var(--space-3);
      align-items: center;
    }
    .control-row label {
      min-width: 50px;
      line-height: 12px;
      display: flex;
      align-items: center;
    }
    .slider {
      width: 140px;
      height: 12px;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
      border: none;
      padding: 0;
      margin: 0;
      display: block;
    }
    .slider::-webkit-slider-runnable-track {
      background: #fff;
      height: 1px;
      border: none;
      margin: 0;
      padding: 0;
    }
    .slider::-webkit-slider-track {
      background: #fff;
      height: 1px;
      border: none;
    }
    .slider::-moz-range-track {
      background: #fff;
      height: 1px;
      border: none;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      background: #fff;
      border: 1px solid #121212;
      border-radius: 50%;
      cursor: pointer;
      margin-top: -6px;
    }
    .slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: #fff;
      border: 1px solid #121212;
      border-radius: 50%;
      cursor: pointer;
      margin-top: 0;
    }
    .value-display {
      min-width: 32px;
      font-size: 12px;
      line-height: 12px;
      display: flex;
      align-items: center;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
  <div id="p5-container"></div>
  <div id="controls">
    <div class="control-row">
      <label for="speedSlider">Speed</label>
      <input type="range" id="speedSlider" class="slider" min="0.1" max="1.9" step="0.05" value="1" />
      <span id="speedValue" class="value-display">1x</span>
    </div>
    <div class="control-row">
      <label for="sizeSlider">Size</label>
      <input type="range" id="sizeSlider" class="slider" min="0.1" max="1.9" step="0.05" value="1" />
      <span id="sizeValue" class="value-display">1x</span>
    </div>
  </div>
  <script>
    // Configuration
    const COLORS = {
      blue: '#0064FF',
      red: '#FF4132',
      yellow: '#ffe600'
    };

    // Names define bubble count
    const NAMES = {
      blue: "designsystem",
      red: "information",
      yellow: "superdot"
    };

    // Size mapping: letter count -> bubble size
    const SIZE_MAP = [0, 50, 100, 200, 400, 800];

    // State
    let speedMultiplier = 1.0;
    let sizeMultiplier = 1.0;
    const baseIncrement = 0.0025;

    // Count how often each letter appears in text
    function countLetters(text) {
      const letters = 'abcdefghijklmnopqrstuvwxyz'.split('');
      return letters.map(letter =>
        (text.toLowerCase().split(letter).length - 1)
      );
    }

    // Create noise offsets for each unique letter count
    function createNoiseOffsets(text) {
      const counts = countLetters(text);
      const activeDots = counts.filter(count => count > 0).length;
      return {
        x: Array(activeDots).fill().map(() => Math.random() * 2000),
        y: Array(activeDots).fill().map(() => Math.random() * 2000)
      };
    }

    const noiseOffsets = {
      blue: createNoiseOffsets(NAMES.blue),
      red: createNoiseOffsets(NAMES.red),
      yellow: createNoiseOffsets(NAMES.yellow)
    };

    function setup() {
      const canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent("p5-container");
      background(30);

      // Setup speed slider
      const speedSlider = document.getElementById('speedSlider');
      const speedValueDisplay = document.getElementById('speedValue');
      speedSlider.addEventListener('input', (e) => {
        speedMultiplier = parseFloat(e.target.value);
        speedValueDisplay.textContent = speedMultiplier.toFixed(1) + 'x';
      });

      // Setup size slider
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValueDisplay = document.getElementById('sizeValue');
      sizeSlider.addEventListener('input', (e) => {
        sizeMultiplier = parseFloat(e.target.value);
        sizeValueDisplay.textContent = sizeMultiplier.toFixed(1) + 'x';
      });
    }

    function draw() {
      background(30, 10);
      generateCircles('blue', COLORS.blue, NAMES.blue, noiseOffsets.blue);
      generateCircles('red', COLORS.red, NAMES.red, noiseOffsets.red);
      generateCircles('yellow', COLORS.yellow, NAMES.yellow, noiseOffsets.yellow);
    }

    function generateCircles(key, color, name, noiseOffset) {
      const letterCounts = countLetters(name);
      const activeDots = letterCounts.filter(count => count > 0);

      blendMode(LIGHTEST);

      for (let i = 0; i < activeDots.length; i++) {
        // Update position
        noiseOffset.x[i] += baseIncrement * speedMultiplier;
        noiseOffset.y[i] += baseIncrement * speedMultiplier;

        // Calculate position with bleed
        const maxBleed = 200;
        const x = map(noise(noiseOffset.x[i]), 0, 1, -maxBleed, width + maxBleed);
        const y = map(noise(noiseOffset.y[i]), 0, 1, -maxBleed, height + maxBleed);

        // Size based on letter frequency: 1x=50, 2x=100, 3x=200, etc.
        const count = activeDots[i];
        const baseSize = SIZE_MAP[Math.min(count, SIZE_MAP.length - 1)];
        const size = baseSize * sizeMultiplier;

        displayDot(x, y, size, color);
      }

      blendMode(BLEND);
    }

    function displayDot(x, y, size, color) {
      noStroke();
      fill(color);
      circle(x, y, size);
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
